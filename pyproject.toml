[project]
name = "code-intel"
version = "0.1.0"
description = "Evidence MCP for coding agents: lookup, impact, verify."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastmcp==3.4.7",
    "pydantic>=2.10,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "pytest-asyncio>=0.24,<1",
]

[project.scripts]
code-intel = "code_intel.cli:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
addopts = "-q"
